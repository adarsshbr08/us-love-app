<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="theme-color" content="#121212" />

  <title>Us ❤️</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="screen">
    <div class="login-card">
      <h1>Us ❤️</h1>
      <p class="subtitle">Adarsh & Rojina's Private Space</p>

      <input
        type="email"
        id="email"
        placeholder="Email address"
      />

      <input
        type="password"
        id="password"
        placeholder="Password"
      />

      <button id="loginBtn">Login ❤️</button>

      <p id="loginError"></p>
    </div>
  </div>


  <!-- MAIN APP -->
  <div id="appScreen" class="screen hidden">

    <header>
      <h1>Us ❤️</h1>
      <button id="logoutBtn">Logout</button>
    </header>

    <main>

      <!-- HOME -->
      <section id="homeSection">
        <h2>Adarsh ❤️ Rojina</h2>

        <div class="card">
          <h3>Our Private Space 🔐</h3>
          <p id="welcomeText">Welcome ❤️</p>
        </div>

        <div class="actions">
          <button id="missYouBtn">🥺 I Miss You</button>
          <button id="loveYouBtn">❤️ I Love You</button>
          <button id="goodMorningBtn">☀️ Good Morning</button>
          <button id="goodNightBtn">🌙 Good Night</button>
        </div>
      </section>


      <!-- CHAT -->
      <section id="chatSection">
        <h2>💬 Our Chat</h2>

        <div id="messages"></div>

        <div class="message-box">
          <input
            type="text"
            id="messageInput"
            placeholder="Type something sweet... ❤️"
          />

          <button id="sendBtn">Send</button>
        </div>

        <p id="chatError"></p>
      </section>


      <!-- LOVE NOTES -->
      <section>
        <h2>💌 Love Notes</h2>

        <textarea
          id="loveNoteInput"
          placeholder="Write something for your partner..."
        ></textarea>

        <button id="saveNoteBtn">Save Note ❤️</button>

        <div id="notes"></div>
      </section>

    </main>


    <!-- BOTTOM NAVIGATION -->
    <nav>
      <button>🏠 Home</button>
      <button>💬 Chat</button>
      <button>💌 Notes</button>
      <button>📸 Memories</button>
    </nav>

  </div>


  <script type="module" src="app.js"></script>

</body>
</html>
